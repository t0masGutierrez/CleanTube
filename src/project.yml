name: CleanTube
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 2PWJB7XYQL
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  CleanTube:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: SafariExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.CleanTube
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SafariExtension:
    type: app-extension
    platform: iOS
    productName: SafariExtension
    productType: com.apple.product-type.app-extension
    sources:
      - path: SafariExtension
      - path: Extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.CleanTube.SafariExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SafariExtension/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  CleanTube:
    build:
      targets:
        CleanTube: all
        SafariExtension: all
    run:
      config: Debug
    archive:
      config: Release
